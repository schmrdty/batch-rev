[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1000000
evm_version = "paris"
bytecode_hash = "none"
cbor_metadata = false
via_ir = false

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
